<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><rect width="1600" height="1030" fill="white"/><text x="50" y="52.2" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#111820">ONE LEARNED MODEL ON THE ORIN</text><rect x="50" y="280" width="350" height="280" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="72" y="325.6" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111820">Observation</text><text x="72" y="370.36" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Image + pose</text><text x="72" y="404.52" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Instruction</text><text x="72" y="438.68" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Mission mode</text><text x="72" y="472.84000000000003" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Map / coverage context</text><rect x="475" y="180" width="600" height="420" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="500" y="235.12" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#003399">ONE VLA</text><text x="500" y="290.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111820">Shared vision + language backbone</text><text x="505" y="366.68" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">Choose event + ground candidate</text><text x="505" y="436.68" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">Predict bounded inspection move</text><text x="505" y="506.68" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">Describe visible litter evidence</text><rect x="1160" y="180" width="390" height="420" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="1182" y="225.6" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111820">