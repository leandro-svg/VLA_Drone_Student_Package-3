f" font-size="29" font-weight="400" fill="#003399">Stable flight</text><text x="1182" y="892.88" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">Track accepted targets</text><polyline points="1350,600 1350,765" fill="none" stroke="#D85A00" stroke-width="5"/><polygon points="1350,765 1342.1706203859978,748.7919521576518 1357.8293796140022,748.7919521576518" fill="#D85A00"/><text x="1380" y="668.84" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#D85A00">Position /</text><text x="1380" y="701.7800000000001" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#D85A00">velocity</text><polyline points="1210,600 1210,685 775,685 775,765" fill="none" stroke="#003399" stroke-width="5"/><polygon points="775,765 767.1706203859978,748.7919521576518 782.8293796140022,748.7919521576518" fill="#003399"/><text x="570" y="661.84" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#003399">Accepted evidence + geometric location</text><text x="50" y="1005.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#626B76">The manager supplies mission context. New observations close the loop after movement.</text></svg>