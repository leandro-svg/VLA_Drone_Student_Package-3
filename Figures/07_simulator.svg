521576518" fill="#626B76"/><text x="70" y="485.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#626B76">reset / layout</text><text x="60" y="947.6" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#111820">The bridge pairs the camera with PX4 estimated state before delivering an observation.</text><text x="60" y="1006.68" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#111820">Privileged ground truth goes only to the evaluator or expert, never to the deployed policy.</text></svg>