<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990"><rect width="1600" height="990" fill="white"/><text x="50" y="51.28" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111820">ONE MODEL ACROSS MISSION MODES</text><text x="50" y="98.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#626B76">Phases are schematic; durations and achievable rates must be measured.</text><text x="546.5" y="204.84" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111820">SURVEY</text><polyline points="420,225 420,840" fill="none" stroke="#D4DAE2" stroke-width="2"/><text x="908.0" y="204.84" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111820">INSPECT</text><polyline points="785,225 785,840" fill="none" stroke="#D4DAE2" stroke-width="2"/><text x="1197.015625" y="204.84" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111820">ANALYSE / RESUME</text><polyline points="1150,225 1150,840" fill="none" stroke="#D4DAE2" stroke-width="2"/><text x="50" y="321.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111820">Camera and logger</text><text x="50" y="481.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111820">CPU manager</text><text x="50" y="641.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111820">ONE VLA on GPU</text><text x="50" y="816.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111820">Flight execution</text><rect x="420" y="270" width="1095" height="85" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="442" y="320.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Acquire observations and save evidence</text><rect x="420" y="430" width="1095" height="85" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="442" y="480.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Check context, events, command validity and route progress</text><rect x="420" y="595" width="365" height="85" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="492.5" y="643.92" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#003399">Events + grounding</text><rect x="785" y="595" width="365" height="85" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="873.5" y="643.92" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#003399">Events + actions</text><rect x="1150" y="595" width="365" height="85" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="1243.0" y="643.92" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#003399">Labels + events</text><rect x="420" y="770" width="365" height="85" fill="#FFF2E8" stroke="#D85A00" stroke-width="3"/><text x="528.0" y="818.92" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#D85A00">Normal route</text><rect x="785" y="770" width="365" height="85" fill="#FFF2E8" stroke="#D85A00" stroke-width="3"/><text x="848.0078125" y="818.92" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#D85A00">Bounded VLA moves</text><rect x="1150" y="770" width="365" height="85" fill="#FFF2E8" stroke="#D85A00" stroke-width="3"/><text x="1243.0" y="818.92" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#D85A00">Hold then rejoin</text><text x="50" y="956.68" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#111820">The model decides when to detour and resume. The manager preserves unfinished coverage.</text></svg>