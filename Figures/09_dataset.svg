<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><rect width="1600" height="1030" fill="white"/><rect x="50" y="30" width="1500" height="130" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="72" y="77.44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111820">One complete mission</text><text x="72" y="124.63999999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#003399">Survey → inspect → analyse → resume; shared mission / layout / session IDs</text><rect x="50" y="245" width="480" height="220" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="72" y="290.6" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111820">Deployable inputs</text><text x="72" y="335.36" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Image + estimated pose</text><text x="72" y="369.52" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Instruction + current mode</text><text x="72" y="403.68" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Budget + map / coverage</text><rect x="560" y="245" width="480" height="220" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="582" y="290.6" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111820">Supervised outputs</text><text x="582" y="335.36" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Event + region + labels</text><text x="582" y="369.52" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Expert inspection action</text><text x="582" y="403.68" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Validity mask for each head</text><rect x="1070" y="245" width="480" height="220" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="1092" y="290.6" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111820">Evaluator only</text><text x="1092" y="335.36" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">True item positions</text><text x="1092" y="369.52" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Future success / failure</text><text x="1092" y="403.68" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#003399">Privileged simulator state</text><polyline points="290,160 290,245" fill="none" stroke="#003399" stroke-width="5"/><polygon points="290,245 282.17062038599784,228.79195215765182 297.82937961400216,228.79195215765182" fill="#003399"/><polyline points="800,160 800,245" fill="none" stroke="#003399" stroke-width="5"/><polygon points="800,245 792.1706203859978,228.79195215765182 807.8293796140022,228.79195215765182" fill="#003399"/><polyline points="1310,160 1310,245" fill="none" stroke="#626B76" stroke-width="5"/><polygon points="1310,245 1302.1706203859978,228.79195215765182 1317.8293796140022,228.79195215765182" fill="#626B76"/><text x="1085" y="522.84" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#D85A00">Never a deployed model input</text><text x="50" y="609.44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111820">VALID LABELS DEPEND ON THE MISSION MODE</text><rect x="50" y="650" width="480" height="175" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="72" y="694.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111820">SURVEY</text><text x="72" y="738.22" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#003399">Event + visible region</text><text x="72" y="771.16" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#003399">No inspection-action loss</text><rect x="560" y="650" width="480" height="175" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="582" y="694.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111820">INSPECT</text><text x="582" y="738.22" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#003399">Event + bounded movement</text><text x="582" y="771.16" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#003399">No future evidence labels</text><rect x="1070" y="650" width="480" height="175" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="1092" y="694.68" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#111820">ANALYSE</text><text x="1092" y="738.22" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#003399">Category + attributes</text><text x="1092" y="771.16" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#003399">Unknown when unsupported</text><text x="50" y="918.52" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111820">Split whole missions and field sessions before sampling frames.</text><text x="50" y="975.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#626B76">The bundled 150 / 30 / 30 episodes are local teaching skills, not complete missions.</text></svg>