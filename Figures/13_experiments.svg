<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020"><rect width="1600" height="1020" fill="white"/><text x="50" y="51.28" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111820">WHAT DOES THE UNIFIED POLICY CONTRIBUTE?</text><rect x="55" y="135" width="1490" height="155" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="77" y="182.44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111820">B0 Classical system</text><text x="77" y="229.64" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#003399">Detector + fixed decision rules + classical inspection</text><polyline points="800,290 800,370" fill="none" stroke="#003399" stroke-width="5"/><polygon points="800,370 792.1706203859978,353.7919521576518 807.8293796140022,353.7919521576518" fill="#003399"/><rect x="55" y="370" width="1490" height="155" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="77" y="417.44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111820">B1 Same learned features and movements</text><text x="77" y="464.64000000000004" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#003399">Unified perception / semantic / action heads + fixed event rules</text><polyline points="800,525 800,605" fill="none" stroke="#003399" stroke-width="5"/><polygon points="800,605 792.1706203859978,588.7919521576518 807.8293796140022,588.7919521576518" fill="#003399"/><rect x="55" y="605" width="1490" height="155" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="77" y="652.44" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111820">U Complete single VLA</text><text x="77" y="699.64" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#003399">Learned events + grounding + semantic labels + inspection actions</text><text x="55" y="848.52" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111820">B0 versus U: complete system value</text><text x="55" y="901.52" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111820">B1 versus U: value of learned mission decisions</text><text x="55" y="966.76" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#626B76">Also remove mission context to test the contribution of history and coverage.</text></svg>