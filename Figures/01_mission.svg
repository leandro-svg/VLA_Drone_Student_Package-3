<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><rect width="1600" height="1030" fill="white"/><text x="50" y="46.28" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111820">NORMAL SURVEY WITH ONE DETOUR</text><rect x="65" y="130" width="660" height="660" fill="#F0F5EF" stroke="#9AAEA0" stroke-width="3"/><polyline points="65,130 65,790" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="230,130 230,790" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="395,130 395,790" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="560,130 560,790" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="725,130 725,790" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="65,130 725,130" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="65,295 725,295" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="65,460 725,460" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="65,625 725,625" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="65,790 725,790" fill="none" stroke="#D8E3D6" stroke-width="2"/><polyline points="130,735 130,190 295,190 295,735 460,735 460,190 645,190 645,735" fill="none" stroke="#003399" stroke-width="6"/><polygon points="645,735 637.1706203859978,718.7919521576518 652.8293796140022,718.7919521576518" fill="#003399"/><circle cx="435" cy="420" r="15" fill="#D85A00" stroke="#D85A00" stroke-width="3"/><text x="465" y="411.68" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#D85A00">litter</text><polyline points="295,440 400,420" fill="none" stroke="#D85A00" stroke-width="6"/><polygon points="400,420 385.5431812410877,430.7238235425599 382.6132377949939,415.34162045056746" fill="#D85A00"/><polyline points="420,445 325,500 295,500" fill="none" stroke="#D85A00" stroke-width="4"/><polygon points="295,500 311.2080478423482,492.17062038599784 311.2080478423482,507.82937961400216" fill="#D85A00"/><circle cx="295" cy="440" r="9" fill="#003399" stroke="#003399" stroke-width="3"/><text x="70" y="863.52" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#003399">Blue: survey route</text><text x="70" y="913.52" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#D85A00">Orange: inspect and rejoin</text><text x="70" y="969.84" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#626B76">Illustrative path; save coverage before detouring.</text><rect x="865" y="120" width="685" height="145" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="887" y="166.52" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111820">1 Survey normally</text><text x="887" y="212.5" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">One VLA monitors images and mission context.</text><polyline points="1205,265 1205,315" fill="none" stroke="#D85A00" stroke-width="5"/><polygon points="1205,315 1197.1706203859978,298.7919521576518 1212.8293796140022,298.7919521576518" fill="#D85A00"/><rect x="865" y="315" width="685" height="145" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="887" y="361.52" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111820">2 Decide to inspect</text><text x="887" y="407.5" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">Save route progress; approach the visible</text><text x="887" y="442.88" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">candidate.</text><polyline points="1205,460 1205,510" fill="none" stroke="#D85A00" stroke-width="5"/><polygon points="1205,510 1197.1706203859978,493.7919521576518 1212.8293796140022,493.7919521576518" fill="#D85A00"/><rect x="865" y="510" width="685" height="145" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="887" y="556.52" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111820">3 Analyse and mark</text><text x="887" y="602.5" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">Record a supported label, location and image.</text><polyline points="1205,655 1205,705" fill="none" stroke="#D85A00" stroke-width="5"/><polygon points="1205,705 1197.1706203859978,688.7919521576518 1212.8293796140022,688.7919521576518" fill="#D85A00"/><rect x="865" y="705" width="685" height="145" fill="#EEF3FB" stroke="#003399" stroke-width="3"/><text x="887" y="751.52" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111820">4 Resume the survey</text><text x="887" y="797.5" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">Rejoin unfinished coverage; avoid duplicate</text><text x="887" y="832.88" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#003399">objects.</text></svg>